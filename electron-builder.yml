appId: com.quentinmayo.ideterm
productName: Mayo's IdeTerm
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  - node_modules/@lydell/**/*
publish:
  provider: github
  owner: quentinmayo
  repo: ideterm
  releaseType: release
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: IdeTerm-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: build/icon.png
  target:
    - dmg
    - zip
  artifactName: IdeTerm-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  artifactName: IdeTerm-${version}.${ext}
  category: Development
  maintainer: Quentin Mayo
